<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Successful — BakaBoost</title>
  <link rel="icon" type="image/png" href="/coffee-mug.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f4f7fc; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 24px; padding: 56px 40px 48px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(15,23,42,0.08); }
    .icon { width: 72px; height: 72px; background: #dcfce7; border-radius: 999px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon svg { width: 36px; height: 36px; }
    h1 { margin: 0 0 10px; font-size: 26px; font-weight: 800; }
    p { margin: 0 0 32px; color: #6b7280; font-size: 16px; line-height: 1.5; }
    .btn { display: inline-block; background: #467ceb; color: #fff; text-decoration: none; border-radius: 999px; padding: 14px 32px; font-size: 16px; font-weight: 700; }
    .btn:hover { background: #3366d6; }
    .creator-link { margin-top: 16px; font-size: 14px; color: #6b7280; }
    .creator-link a { color: #467ceb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Payment successful!</h1>
    <p id="thanks-msg">Thank you for your support. Your donation means a lot to the creator.</p>
    <a class="btn" id="back-btn" href="/">Back to BakaBoost</a>
    <p class="creator-link" id="creator-link" style="display:none">
      Return to <a id="creator-href" href="/">the creator's page</a>
    </p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const creator = params.get("creator");
    if (creator) {
      document.getElementById("thanks-msg").textContent =
        `Thank you for supporting ${creator} on BakaBoost. Your donation means a lot!`;
      const backBtn = document.getElementById("back-btn");
      backBtn.href = `/${creator}`;
      backBtn.textContent = `Back to ${creator}'s page`;
      const creatorLink = document.getElementById("creator-link");
      const creatorHref = document.getElementById("creator-href");
      creatorHref.href = `/${creator}`;
      creatorHref.textContent = `${creator}'s page`;
    }
  </script>
</body>
</html>
